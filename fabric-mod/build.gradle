plugins {
    id 'fabric-loom' version '1.16.2'
    id 'maven-publish'
}

version = "1.0.0"
group = "com.mcyt.client"

repositories {
    mavenCentral()
    maven { url = "https://m2.dv8tion.net/releases" } // Lavaplayer repository if needed, but jitpack is better for forks
    maven { url = "https://jitpack.io" }
}

dependencies {
    minecraft "com.mojang:minecraft:26.1.2"
    mappings "net.fabricmc:yarn:26.1.2+build.1:v2"
    modImplementation "net.fabricmc:fabric-loader:0.19.2"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.149.1+26.1.2"

    // Lavaplayer fork that is actively maintained (dev.arbjerg.lavaplayer)
    implementation "dev.arbjerg.lavaplayer:lavaplayer:2.2.2"
    include "dev.arbjerg.lavaplayer:lavaplayer:2.2.2"
    // Lavaplayer transitive dependencies might need explicit includes if they are not in Java SE
    // But for a simple test we can try just including lavaplayer and its core dependencies.
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
