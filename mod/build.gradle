plugins {
    id 'net.fabricmc.fabric-loom' version '1.18.2'
    id 'com.gradleup.shadow' version '9.6.1'
}

version = findProperty('buildVersion') ?: 'develop'

java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }

repositories {
    mavenCentral()
    maven { url = 'https://maven.lavalink.dev/releases' }
    maven { url = 'https://jitpack.io' }
    maven { url = 'https://maven.terraformersmc.com/releases' }
}

loom {
    splitEnvironmentSourceSets()
    mods {
        ytparty {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

configurations {
    bundle
    slim
    clientImplementation.extendsFrom bundle
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    bundle "dev.arbjerg:lavaplayer:${project.lavaplayer_version}"
    bundle "com.github.TeamNewPipe:NewPipeExtractor:${project.newpipe_version}"
    slim("dev.arbjerg:lavaplayer:${project.lavaplayer_version}") { transitive = false }
    slim("dev.arbjerg:lava-common:${project.lavaplayer_version}") { transitive = false }
    slim "com.github.TeamNewPipe:NewPipeExtractor:${project.newpipe_version}"
    compileOnly("com.terraformersmc:modmenu:${project.modmenu_version}") { transitive = false }
}

shadowJar {
    configurations = [project.configurations.bundle]
    from sourceSets.main.output
    from sourceSets.client.output
    archiveClassifier = 'bundle'
    mergeServiceFiles()
}

tasks.register('slimJar', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar) {
    dependsOn classes
    configurations = [project.configurations.slim]
    archiveClassifier = 'slim'
    from sourceSets.main.output
    from(sourceSets.client.output) { exclude 'fabric.mod.json' }
    from('slimMeta') { into '/'; expand version: version }
    exclude 'META-INF/INDEX.LIST', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/versions/**/module-info.class', 'module-info.class'
    mergeServiceFiles()
}
assemble.dependsOn slimJar

tasks.named('processClientResources') {
    inputs.property 'version', version
    filesMatching('fabric.mod.json') { expand version: version }
}
