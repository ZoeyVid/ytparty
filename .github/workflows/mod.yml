name: mod
on:
  push:
    branches:
      - develop
    paths:
      - mod/**
      - .github/workflows/mod.yml
  pull_request:
    paths:
      - mod/**
      - .github/workflows/mod.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  mod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: corretto
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6.4.1
        with:
          cache-disabled: true
      - name: date
        id: date
        run: echo "value=$(date +%Y-%m-%d)-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - name: build
        working-directory: mod
        run: ./gradlew shadowJar slimJar --no-daemon --stacktrace -PbuildVersion=${{ steps.date.outputs.value }}
      - uses: actions/upload-artifact@v7.0.2
        with:
          path: mod/build/libs/*-bundle.jar
          archive: false
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v7.0.2
        with:
          path: mod/build/libs/*-slim.jar
          archive: false
          if-no-files-found: error
          retention-days: 3
      - uses: Kira-NT/mc-publish@v3.3.2
        if: ${{ github.repository_owner == 'ZoeyVid' && github.event_name != 'pull_request' }}
        with:
          version-type: release
          modrinth-featured: true
          github-prerelease: false
          name: Mod ${{ steps.date.outputs.value }}
          version: mod-${{ steps.date.outputs.value }}
          github-tag: mod-${{ steps.date.outputs.value }}
          files: | 
            mod/build/libs/*-bundle.jar
            mod/build/libs/*-slim.jar
          java: |
            25
          loaders: |
            fabric
          game-versions: |
            26.3
          modrinth-id: ohwyynXQ
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
