name: mod
on:
  push:
    paths:
      - mod/**
      - .github/workflows/mod.yml
  pull_request:
    paths:
      - mod/**
      - .github/workflows/mod.yml
  workflow_dispatch:
jobs:
  mod:
    name: fabric mod (full + server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: corretto
          java-version: '25'
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-disabled: true
      - id: date
        run: echo "value=$(date +%Y-%m-%d)-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - name: build jars
        working-directory: mod
        run: ./gradlew shadowJar serverJar --no-daemon --stacktrace -PbuildVersion=${{ steps.date.outputs.value }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: mod/build/libs/*-bundle.jar
          archive: false
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: mod/build/libs/*-server.jar
          archive: false
          if-no-files-found: error
          retention-days: 3
      - uses: Kir-Antipov/mc-publish@995edadc13559a8b28d0b7e6571229f067ec7659 # v3.3.0
        if: github.ref_name == 'latest'
        with:
          version-type: release
          modrinth-featured: true
          github-prerelease: false
          name: Mod ${{ steps.date.outputs.value }}
          version: mod-${{ steps.date.outputs.value }}
          github-tag: mod-${{ steps.date.outputs.value }}
          files: | 
            mod/build/libs/*-bundle.jar
            mod/build/libs/*-server.jar
          java: |
            25
          loaders: |
            fabric
          game-versions: |
            26.2
          modrinth-id: ohwyynXQ
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
