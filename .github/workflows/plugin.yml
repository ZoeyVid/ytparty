name: plugin
on:
  push:
    paths:
      - plugin/**
      - .github/workflows/plugin.yml
  pull_request:
    paths:
      - plugin/**
      - .github/workflows/plugin.yml
  workflow_dispatch:
jobs:
  plugin:
    name: bukkit plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          distribution: corretto
          java-version: |
            8
            25
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-disabled: true
      - name: build jar
        working-directory: plugin
        run: ./gradlew build --no-daemon --stacktrace -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: plugin/build/libs/*.jar
          archive: false
          if-no-files-found: error
      - id: date
        if: github.ref_name == 'latest'
        run: echo "value=$(date +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"
      - uses: Kir-Antipov/mc-publish@995edadc13559a8b28d0b7e6571229f067ec7659 # v3.3.0
        if: github.ref_name == 'latest'
        with:
          version-type: release
          modrinth-featured: true
          github-prerelease: false
          name: Plugin
          version: plugin-${{ steps.date.outputs.value }}
          github-tag: plugin-${{ steps.date.outputs.value }}
          files: plugin/build/libs/*.jar
          java: |
            8
            11
            16
            17
            21
            25
          loaders: |
            bukkit
            spigot
            paper
            purpur
            folia
          game-versions: |
            >=1.8
          modrinth-id: ohwyynXQ
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
