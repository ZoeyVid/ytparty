name: relay
on:
  push:
    branches:
      - develop
    paths:
      - relay/**
      - .github/workflows/relay.yml
  pull_request:
    paths:
      - relay/**
      - .github/workflows/relay.yml
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          driver-opts: env.BUILDKIT_STEP_LOG_MAX_SIZE=-1
      - name: docker.io-login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: ${{ github.repository_owner == 'ZoeyVid' && github.event_name != 'pull_request' }}
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: ghcr.io-login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: ${{ github.repository_owner == 'ZoeyVid' && github.event_name != 'pull_request' }}
        with:
          registry: ghcr.io
          username: zoeyvid
          password: ${{ github.token }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: relay
          platforms: linux/amd64,linux/arm64
          push: ${{ github.repository_owner == 'ZoeyVid' && github.event_name != 'pull_request' }}
          tags: |
            zoeyvid/ytparty:latest
            ghcr.io/zoeyvid/ytparty:latest
