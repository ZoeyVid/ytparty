name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  relay:
    name: relay (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - name: build static binary
        working-directory: relay
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: go build -trimpath -ldflags "-s -w" -o ytparty-relay-linux-${{ matrix.arch }} .
      - uses: actions/upload-artifact@v4
        with:
          name: ytparty-relay-linux-${{ matrix.arch }}
          path: relay/ytparty-relay-linux-${{ matrix.arch }}
          if-no-files-found: error

  mod:
    name: fabric mod (full + server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
      - name: build jars
        working-directory: mod
        run: ./gradlew shadowJar serverJar --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ytparty-mod
          path: mod/build/libs/*.jar
          if-no-files-found: error

  plugin:
    name: paper plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
      - name: build jar
        working-directory: plugin
        run: ./gradlew build --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ytparty-plugin
          path: plugin/build/libs/*.jar
          if-no-files-found: error
